[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
jackson = "3.2.4"
slf4j = "2.0.20"
junit = "6.1.3"
kover = "0.9.11"
dokka = "2.2.0"
maven-publish = "0.37.0"
brotli4j = "1.23.0"
zstd = "1.5.7-24"
commons-compress = "1.28.0"
xz = "1.12"
nimbus-jose = "10.10"
swagger = "2.2.55"
pebble = "4.1.2"
koin = "4.2.2"
bouncycastle = "1.86"
kotlinx-benchmark = "0.5.0"
netty = "4.2.19.Final"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson-xml = { module = "tools.jackson.dataformat:jackson-dataformat-xml" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
brotli4j = { module = "com.aayushatharva.brotli4j:brotli4j", version.ref = "brotli4j" }
brotli4j-native-linux-x64 = { module = "com.aayushatharva.brotli4j:native-linux-x86_64", version.ref = "brotli4j" }
brotli4j-native-linux-arm64 = { module = "com.aayushatharva.brotli4j:native-linux-aarch64", version.ref = "brotli4j" }
brotli4j-native-windows-x64 = { module = "com.aayushatharva.brotli4j:native-windows-x86_64", version.ref = "brotli4j" }
brotli4j-native-windows-arm64 = { module = "com.aayushatharva.brotli4j:native-windows-aarch64", version.ref = "brotli4j" }
brotli4j-native-osx-x64 = { module = "com.aayushatharva.brotli4j:native-osx-x86_64", version.ref = "brotli4j" }
brotli4j-native-osx-arm64 = { module = "com.aayushatharva.brotli4j:native-osx-aarch64", version.ref = "brotli4j" }
zstd = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
nimbus-jose = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose" }
swagger-core = { module = "io.swagger.core.v3:swagger-core-jakarta", version.ref = "swagger" }
pebble = { module = "io.pebbletemplates:pebble", version.ref = "pebble" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport" }
netty-handler = { module = "io.netty:netty-handler" }
netty-epoll = { module = "io.netty:netty-transport-classes-epoll" }
netty-epoll-native = { module = "io.netty:netty-transport-native-epoll" }
netty-iouring = { module = "io.netty:netty-transport-classes-io_uring" }
netty-iouring-native = { module = "io.netty:netty-transport-native-io_uring" }

# build-logic
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
gradle-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradle-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
gradle-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
gradle-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
gradle-benchmark = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-plugin", version.ref = "kotlinx-benchmark" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinx-benchmark" }

[plugins]
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
